<?xml version="1.0" ?>
<svg viewBox="0 0 680 380" width="100%" role="img" font-family="DejaVuSans, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>LOWO method overview figure</title>
  <desc>Fig.1: LOWO drops in at four sites (stem, downsample, upsample, equal-channel 3x3x3 convolution). An orthogonal analysis bank is followed by a lossy 1x1 mixer (8C to Cout). Perfect reconstruction is a property of the DWT/IDWT pair only.</desc>
  <rect x="20" y="14" width="640" height="352" rx="20" fill="none" stroke="#5F5E5A" stroke-width="1.0" stroke-dasharray="6 4"/>
  <text x="36" y="34" font-size="12" fill="#444441" text-anchor="start">SegMamba backbone (unchanged)</text>
  <rect x="248" y="42" width="184" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
  <text x="340" y="56" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="500">3D input volume</text>
  <text x="340" y="70" font-size="11" fill="#5F5E5A" text-anchor="middle">4 modalities</text>
  <line x1="340" y1="78" x2="340" y2="96" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="24" y="98" width="632" height="214" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.0"/>
  <text x="40" y="116" font-size="12" fill="#3C3489" text-anchor="start">LOWO (proposed, drop-in)</text>
  <rect x="40" y="124" width="144" height="26" rx="6" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1.0"/>
  <text x="112" y="142" font-size="11" fill="#2C2C2A" text-anchor="middle">(i) stem</text>
  <rect x="194" y="124" width="144" height="26" rx="6" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1.0"/>
  <text x="266" y="142" font-size="11" fill="#2C2C2A" text-anchor="middle">(ii) downsample</text>
  <rect x="348" y="124" width="144" height="26" rx="6" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1.0"/>
  <text x="420" y="142" font-size="11" fill="#2C2C2A" text-anchor="middle">(iii) upsample</text>
  <rect x="502" y="124" width="144" height="26" rx="6" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1.0"/>
  <text x="574" y="142" font-size="11" fill="#2C2C2A" text-anchor="middle">(iv) 3×3×3</text>
  <rect x="38" y="164" width="160" height="96" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.0"/>
  <text x="118" y="184" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500">analysis</text>
  <text x="118" y="204" font-size="11" fill="#185FA5" text-anchor="middle">DWT  ·  K = Q K_haar</text>
  <text x="118" y="220" font-size="11" fill="#185FA5" text-anchor="middle">Q = exp(A−A^T)</text>
  <text x="118" y="236" font-size="11" fill="#185FA5" text-anchor="middle">∈ SO(8)</text>
  <rect x="218" y="160" width="256" height="104" rx="8" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="1.0"/>
  <text x="346" y="178" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="500">1×1 mixer (lossy)</text>
  <text x="346" y="194" font-size="11" fill="#5F5E5A" text-anchor="middle">8C → C_out</text>
  <rect x="230" y="204" width="232" height="26" rx="5" fill="#FAECE7" stroke="#D85A30" stroke-width="1.0" stroke-dasharray="4 3"/>
  <text x="346" y="222" font-size="11" fill="#993C1D" text-anchor="middle">groups=1  ·  Q absorbed</text>
  <rect x="230" y="234" width="232" height="26" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.0"/>
  <text x="346" y="252" font-size="11" fill="#085041" text-anchor="middle">groups=8  ·  Q load-bearing</text>
  <rect x="494" y="164" width="146" height="96" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.0"/>
  <text x="567" y="184" font-size="13" fill="#27500A" text-anchor="middle" font-weight="500">synthesis</text>
  <text x="567" y="204" font-size="11" fill="#3B6D11" text-anchor="middle">IDWT</text>
  <text x="567" y="220" font-size="11" fill="#3B6D11" text-anchor="middle">sites (iii), (iv)</text>
  <line x1="198" y1="212" x2="218" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="474" y1="212" x2="494" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="118,260 118,274 567,274 567,260" fill="none" stroke="#3B6D11" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="340" y="292" font-size="10" fill="#27500A" text-anchor="middle">PR of the pair only: IDWT(DWT(x)) = x for every Q ∈ SO(8).  Mixer remains lossy.</text>
  <line x1="340" y1="312" x2="340" y2="330" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="248" y="332" width="184" height="28" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.0"/>
  <text x="340" y="351" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="500">segmentation map</text>
</svg>
