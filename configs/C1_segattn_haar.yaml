# ─── Exp3: SegAttn-Haar (跨架构 attention arm, wb=0) ─────────────
# 用法: python train_brats2021.py --config configs/exp3_segattn_haar.yaml --tag segattn_haar
# 与 Exp2 唯一区别: sequence mixer 从 Mamba 换成 Swin window-attention

model: segattn_haar

batch_size: 1                # attention 显存大; bs2 通常 OOM @ 128^3
max_epoch: 500
val_every: 2
device: cuda:0
master_port: 17761
roi_size: [128, 128, 128]
resume: true
train_process: 12

use_dice_ce: true
deep_supervision: true
wavelet_boundary_weight: 0.0

wavelet_mode: so8
learnable_wavelet: true
gsc_checkpoint: false
per_channel_stem: false
per_channel_wavelet: false

window_size: [7, 7, 7]
num_heads: null
attn_checkpoint: true        # bs1 必须开
