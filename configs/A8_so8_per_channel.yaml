# Paper arm A8
# backbone: SegMamba + LOWO
# wavelet:  learnable Q ∈ SO(8), per input channel
# mixer:    per-channel
# extra:    A5 + per-channel stem/wavelet (changes stem state_dict keys; train from scratch)
# train:    python train_brats2021.py --config configs/A8_so8_per_channel.yaml

model: segmamba_haar

batch_size: 2
max_epoch: 500
val_every: 2
device: cuda:0
master_port: 17766
roi_size: [128, 128, 128]
resume: true
train_process: 12

use_dice_ce: true
deep_supervision: true
wavelet_boundary_weight: 0.0

wavelet_mode: so8
learnable_wavelet: true
gsc_checkpoint: false
per_channel_stem: true
per_channel_wavelet: true
grouped_mix: false

window_size: null
num_heads: null
attn_checkpoint: null
