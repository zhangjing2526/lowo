# ─── Exp8: SegMamba-Haar per-channel (每 MRI 通道独立小波基) ─────
# 用法: python train_brats2021.py --config configs/exp8_segmamba_haar_perchannel.yaml --tag segmamba_haar_perch
# 注意: 改变 stem state_dict 键 → 只能从头训练 (本表本来就是新训练, 无影响)

model: segmamba_haar

batch_size: 2
max_epoch: 500
val_every: 2
device: cuda:0
master_port: 17766
roi_size: [128, 128, 128]
resume: true
train_process: 12

use_dice_ce: true
deep_supervision: true
wavelet_boundary_weight: 0.0

wavelet_mode: so8
learnable_wavelet: true
gsc_checkpoint: false
per_channel_stem: true
per_channel_wavelet: true

window_size: null
num_heads: null
attn_checkpoint: null
