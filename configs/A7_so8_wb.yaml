# ─── Exp4: SegMamba-Haar + wavelet boundary loss (wb=0.1) ────────
# 用法: python train_brats2021.py --config configs/exp4_segmamba_haar_wb.yaml --tag segmamba_haar_wb
# 论文里作为 "+ wavelet boundary loss" 的正交增强单独成行

model: segmamba_haar

batch_size: 2
max_epoch: 500
val_every: 2
device: cuda:0
master_port: 17762
roi_size: [128, 128, 128]
resume: true
train_process: 12

use_dice_ce: true
deep_supervision: true
wavelet_boundary_weight: 0.1

wavelet_mode: so8
learnable_wavelet: true
gsc_checkpoint: false
per_channel_stem: false
per_channel_wavelet: false

window_size: null
num_heads: null
attn_checkpoint: null
