# ─── Exp10: UNETR baseline (isotropic ViT encoder) ────────────────
# 用法: python train_brats2021.py --config configs/exp10_unetr.yaml --tag unetr
#
# 先跑上界，再决定要不要训 500 epoch：
#   python measure_unetr_attn_ceiling.py --device cuda:0 --csv unetr_attn_ceiling.csv
# 若 e2e mixer_from=6 只有 ~1.0x，不要开训——官方 patch=16 的 N=512 让 QK^T 不够贵。
#
# 对照臂：12 层全是 SABlock，mixer_from=12。

model: unetr
mixer_from: 12
feature_size: 16
hidden_size: 768
mlp_dim: 3072
num_heads: 12

batch_size: 1
max_epoch: 500
val_every: 2
device: cuda:0
master_port: 17781
roi_size: [128, 128, 128]
resume: true
train_process: 12

use_dice_ce: true
deep_supervision: false
wavelet_boundary_weight: 0.0

wavelet_mode: null
learnable_wavelet: null
gsc_checkpoint: null
per_channel_stem: null
per_channel_wavelet: null

window_size: null
attn_checkpoint: null
