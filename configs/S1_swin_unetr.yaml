# Paper arm S1
# backbone: SwinUNETR (MONAI, feature_size=48)
# wavelet:  —
# mixer:    —
# train:    python train_swin_unetr_brats2021.py --config configs/S1_swin_unetr.yaml
#
# Architecture matches the trained paper checkpoint: depths=[2,2,2,2],
# num_heads=[3,6,12,24], CE loss, no deep supervision.

model: swin_unetr
feature_size: 48
depths: [2, 2, 2, 2]
num_heads: [3, 6, 12, 24]
norm_name: instance
drop_rate: 0.0
attn_drop_rate: 0.0
dropout_path_rate: 0.0
use_checkpoint: false

batch_size: 2
max_epoch: 500
val_every: 2
device: cuda:0
master_port: 17760
roi_size: [128, 128, 128]
resume: true
train_process: 18

use_dice_ce: false
deep_supervision: false
wavelet_boundary_weight: 0.0

wavelet_mode: null
learnable_wavelet: null
gsc_checkpoint: null
per_channel_stem: null
per_channel_wavelet: null
grouped_mix: null
