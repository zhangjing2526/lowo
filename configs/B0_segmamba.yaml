# Paper arm B0
# backbone: SegMamba (learned stride-2 conv, no LOWO)
# wavelet:  —
# mixer:    —
# train:    python train_brats2021.py --config configs/B0_segmamba.yaml

model: segmamba

batch_size: 2
max_epoch: 500
val_every: 2
device: cuda:0
master_port: 17759
roi_size: [128, 128, 128]
resume: true
train_process: 12

use_dice_ce: true
deep_supervision: true
wavelet_boundary_weight: 0.0

wavelet_mode: null
learnable_wavelet: null
gsc_checkpoint: null
per_channel_stem: null
per_channel_wavelet: null
grouped_mix: null

window_size: null
num_heads: null
attn_checkpoint: null
