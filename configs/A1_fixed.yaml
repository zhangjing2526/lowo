# ─── Exp6: SegMamba-Haar 固定 Haar (learnable_wavelet=false) ─────
# 用法: python train_brats2021.py --config configs/exp6_segmamba_haar_fixed.yaml --tag segmamba_haar_fixed
# 固定 vs 可学习消融: so8 模式下 skew 冻结为 0 → Q=I → 恰为标准固定 Haar

model: segmamba_haar

batch_size: 2
max_epoch: 500
val_every: 2
device: cuda:0
master_port: 17764
roi_size: [128, 128, 128]
resume: true
train_process: 12

use_dice_ce: true
deep_supervision: true
wavelet_boundary_weight: 0.0

wavelet_mode: so8
learnable_wavelet: false
gsc_checkpoint: false
per_channel_stem: false
per_channel_wavelet: false

window_size: null
num_heads: null
attn_checkpoint: null
