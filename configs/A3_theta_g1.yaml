# Paper arm A3
# backbone: SegMamba + LOWO
# wavelet:  learnable θ (3 DOF, axis-separable)
# mixer:    groups=1
# train:    python train_brats2021.py --config configs/A3_theta_g1.yaml

model: segmamba_haar

batch_size: 2
max_epoch: 500
val_every: 2
device: cuda:0
master_port: 17765
roi_size: [128, 128, 128]
resume: true
train_process: 12

use_dice_ce: true
deep_supervision: true
wavelet_boundary_weight: 0.0

wavelet_mode: theta
learnable_wavelet: true
gsc_checkpoint: false
per_channel_stem: false
per_channel_wavelet: false
grouped_mix: false

window_size: null
num_heads: null
attn_checkpoint: null
