# ─── Exp7: SegMamba-Haar theta (3-DOF 可分离, vs so8) ────────────
# 用法: python train_brats2021.py --config configs/exp7_segmamba_haar_theta.yaml --tag segmamba_haar_theta
# so8(28-DOF 不可分离) vs theta(3-DOF 逐轴可分离) 的参数化消融

model: segmamba_haar

batch_size: 2
max_epoch: 500
val_every: 2
device: cuda:0
master_port: 17765
roi_size: [128, 128, 128]
resume: true
train_process: 12

use_dice_ce: true
deep_supervision: true
wavelet_boundary_weight: 0.0

wavelet_mode: theta
learnable_wavelet: true
gsc_checkpoint: false
per_channel_stem: false
per_channel_wavelet: false

window_size: null
num_heads: null
attn_checkpoint: null
