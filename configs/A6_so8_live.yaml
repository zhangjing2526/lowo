# ─── Exp6c: SegMamba-Haar so8 LEARNABLE but actually used ─────────
# 用法: 在打过 lowo.py 补丁（HaarDownsample.mix -> groups=8）之后运行：
#   python train_brats2021.py --config configs/exp6c_segmamba_haar_so8_live.yaml --tag segmamba_haar_so8live
#
# 与 exp2 (segmamba_haar) 配置完全相同，唯一区别是：
#   - lowo.py 已修复（groups=8 混合器 + 固定核缓存），so8 的 Q 不再是"空转"
#   - tag 改成 segmamba_haar_so8live，避免和旧的"空转" run 撞 checkpoint
# 若同时想启用解码器修复（diff_haar_blocks.patch），也一并打上，并把本配置
# 的 tag 记为 segmamba_haar_so8live_dec。注意：解码器修复会改变解码融合块，
# 对"so8 是否优于 fixed"的对比如实需把同一解码器改动也应用到 fixed arm 上。

model: segmamba_haar

batch_size: 2
max_epoch: 500
val_every: 2
device: cuda:0
master_port: 17766
roi_size: [128, 128, 128]
resume: true
train_process: 12

use_dice_ce: true
deep_supervision: true
wavelet_boundary_weight: 0.0

wavelet_mode: so8
learnable_wavelet: true
gsc_checkpoint: false
per_channel_stem: false
per_channel_wavelet: false
grouped_mix: true

window_size: null
num_heads: null
attn_checkpoint: null
